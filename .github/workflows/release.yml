name: Build release ZIP
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt homeassistant==2026.11.1
      - run: python -m pytest -q
      - if: github.ref_type == 'tag'
        run: python tools/build_release.py --tag "$GITHUB_REF_NAME"
      - if: github.ref_type != 'tag'
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-local-release
          path: dist/ps5_local.zip
